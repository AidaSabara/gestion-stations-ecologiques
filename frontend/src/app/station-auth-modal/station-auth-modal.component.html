<!-- Ajouter #modalElement à la div principale -->
<div #modalElement class="modal fade" id="stationAuthModal" tabindex="-1" aria-labelledby="authModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <!-- En-tête -->
      <div class="modal-header bg-primary text-white">
        <h5 class="modal-title" id="authModalLabel">
          <i class="bi bi-shield-lock me-2"></i>
          Authentification requise
        </h5>
        <button type="button" class="btn-close btn-close-white"
                data-bs-dismiss="modal"
                (click)="closeModal()"
                aria-label="Close"></button>
      </div>

      <!-- Corps -->
      <div class="modal-body">
        <div class="text-center mb-4">
          <i class="bi bi-droplet-fill text-primary display-6"></i>
          <h6 class="mt-2">Accès aux données de la station</h6>
          <p class="text-muted small">
            Veuillez vous authentifier pour accéder au tableau de données de
            <strong>{{ stationName }}</strong>
          </p>
        </div>

        <form (ngSubmit)="onSubmit()" #authForm="ngForm">
          <!-- Email -->
          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <div class="input-group">
              <span class="input-group-text">
                <i class="bi bi-envelope"></i>
              </span>
              <input
                type="email"
                class="form-control"
                id="email"
                [(ngModel)]="email"
                name="email"
                placeholder="votre@email.com"
                required
                [class.is-invalid]="errorMessage && !email"
                [disabled]="isLoading">
            </div>
          </div>

          <!-- Mot de passe -->
          <div class="mb-3">
            <label for="password" class="form-label">Mot de passe</label>
            <div class="input-group">
              <span class="input-group-text">
                <i class="bi bi-key"></i>
              </span>
              <input
                type="password"
                class="form-control"
                id="password"
                [(ngModel)]="password"
                name="password"
                placeholder="Votre mot de passe"
                required
                [class.is-invalid]="errorMessage && !password"
                [disabled]="isLoading">
            </div>
          </div>

          <!-- Message d'erreur -->
          <div *ngIf="errorMessage" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            {{ errorMessage }}
            <button type="button" class="btn-close" (click)="errorMessage = ''" aria-label="Close"></button>
          </div>
        </form>
      </div>

      <!-- Pied -->
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary"
                data-bs-dismiss="modal"
                (click)="closeModal()"
                [disabled]="isLoading">
          <i class="bi bi-x-circle me-1"></i>
          Annuler
        </button>
        <button
          type="button"
          class="btn btn-primary"
          (click)="onSubmit()"
          [disabled]="isLoading || !email || !password">
          <span *ngIf="!isLoading">
            <i class="bi bi-unlock me-1"></i>
            Se connecter
          </span>
          <span *ngIf="isLoading">
            <span class="spinner-border spinner-border-sm me-1" role="status"></span>
            Connexion...
          </span>
        </button>
      </div>
    </div>
  </div>
</div>
